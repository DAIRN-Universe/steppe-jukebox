<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steppe Jukebox</title>
  <link rel="stylesheet" href="styles.css">
  <script src="map_view.js" defer></script>
  <script src="grid_map.js" defer></script>
  <script src="live_player.js" defer></script>
  <script src="player.js" defer></script>
</head>
<body>
<main id="interface" data-i18n-aria="interface_label" hidden>
  <header class="site-header">
    <a class="brand" href="#" data-open-view="listen"><span class="brand-origin">DAIRN</span><strong>Steppe Jukebox</strong></a>
    <img class="hackathon-logo" src="assets/space-apps-logo.svg" width="561" height="221" alt="NASA International Space Apps Challenge">
    <div class="header-actions">
      <nav id="navigation" role="tablist" data-i18n-aria="navigation_label">
        <button id="tab-listen" role="tab" aria-selected="true" aria-controls="listen-view" data-view="listen" data-i18n="listen_nav"></button>
        <button id="tab-method" role="tab" aria-selected="false" aria-controls="method-view" tabindex="-1" data-view="method" data-i18n="method_nav"></button>
      </nav>
      <div class="language-field">
        <label for="language" data-i18n="language_label">Language</label>
        <select id="language">
          <option id="system-language" value="auto">System language</option>
          <option value="kk" lang="kk">Қазақша</option>
          <option value="en" lang="en">English</option>
          <option value="ru" lang="ru">Русский</option>
        </select>
      </div>
    </div>
  </header>
  <div class="page-content">
    <p id="test-warning" class="warning" data-i18n="test_warning" hidden></p>
    <p id="data-error" role="alert" hidden></p>
    <div id="listen-heading" class="page-heading" hidden>
      <div><p class="eyebrow" data-i18n="listen_eyebrow"></p><h1 data-i18n="listen_title"></h1><p data-i18n="intro"></p></div>
      <span class="edition">NASA SPACE APPS<br>MINIMAL INSTRUMENT</span>
    </div>
    <div class="player-layout">
      <aside id="selection-panel" class="selection-panel" aria-labelledby="selection-panel-title" hidden>
        <h2 id="selection-panel-title" data-i18n="route_settings"></h2>
        <div class="selections">
          <div id="region-field" class="region-field season-field" hidden>
            <label for="region" data-i18n="region_label"></label><select id="region"></select>
          </div>
          <div id="live-controls" class="live-controls" hidden>
            <div class="season-field"><label for="provider" data-i18n="live_source"></label><select id="provider"><option value="gibs">NASA GIBS · NOAA-20</option><option value="eic">NASA EIC · Suomi NPP</option></select></div>
            <div id="date-field" class="season-field"><label for="observation-date" data-i18n="live_date"></label><input id="observation-date" type="date" value="2026-04-20"><select id="eic-date" hidden data-i18n-aria="live_date"></select></div>
          </div>
          <div id="mode-field" class="season-field" hidden>
            <label for="mode" data-i18n="mode_label"></label>
            <select id="mode"><option value="fixed" data-i18n="fixed_mode"></option><option value="journey" data-i18n="journey"></option></select>
          </div>
          <div id="season-field" class="season-field">
            <label for="season" data-i18n="season_label">Season</label><select id="season" aria-describedby="season-info"></select>
          </div>
          <button id="load-data" data-i18n="live_load" hidden></button>
          <details id="route-points" hidden>
            <summary><span data-i18n="route_points"></span><span id="route-point-counter" class="muted" aria-hidden="true"></span></summary>
            <div class="route-points-body">
            <label class="point-edit-toggle"><input id="add-route-points" type="checkbox"><span data-i18n="route_add"></span></label>
            <p class="muted" data-i18n="route_points_hint"></p>
            <ol id="route-coordinate-list" data-i18n-aria="route_coordinates"></ol>
            <p id="route-feedback" role="status" aria-live="polite"></p>
            <button id="reset-route" class="secondary" type="button" data-i18n="route_reset"></button>
            </div>
          </details>
        </div>
        <p id="load-state" role="status" aria-live="polite" hidden></p>
      </aside>
      <section id="playback-controls" class="playback-card" hidden data-i18n-aria="player_heading">
        <div class="transport">
          <button id="step-back" class="secondary step-button" type="button" aria-controls="audio route-map" aria-keyshortcuts="ArrowLeft" data-i18n-aria="step_back" data-i18n-title="step_back" disabled>←</button>
          <button id="toggle" type="button" aria-controls="audio">Play</button>
          <button id="step-forward" class="secondary step-button" type="button" aria-controls="audio route-map" aria-keyshortcuts="ArrowRight" data-i18n-aria="step_forward" data-i18n-title="step_forward" disabled>→</button>
          <button id="restart" class="secondary" type="button" data-i18n="restart"></button>
        </div>
        <div class="position">
          <div class="position-label"><label for="progress" data-i18n="progress_heading"></label><span id="clock"></span></div>
          <input id="progress" type="range" min="0" max="1" step="0.01" value="0" data-i18n-aria="progress_label" aria-controls="audio route-map" aria-describedby="seek-help" disabled>
        </div>
        <p id="tempo" class="muted"></p><p id="keyboard-help" class="muted" data-i18n="keyboard_help"></p>
        <p id="seek-help" class="sr-only" data-i18n="seek_help"></p>
        <audio id="audio" preload="auto" data-i18n-aria="audio_label"></audio>
        <p id="error" role="alert" hidden></p>
      </section>
    <div id="player" hidden>
      <section id="listen-view" class="view" role="tabpanel" aria-labelledby="tab-listen">
        <div class="listen-grid">
            <figure class="map-card">
              <figcaption><span id="map-region"></span><span data-i18n="route_heading"></span></figcaption>

              <div id="map-tools" class="map-tools" role="group" data-i18n-aria="map_tools" hidden>
                <button id="map-zoom-in" type="button" data-i18n-aria="map_zoom_in" data-i18n-title="map_zoom_in">+</button>
                <output id="map-zoom-level" aria-live="polite">100%</output>
                <button id="map-zoom-out" type="button" data-i18n-aria="map_zoom_out" data-i18n-title="map_zoom_out">−</button>
                <button id="map-fit" type="button" data-i18n="map_fit"></button>
                <span data-i18n="map_gesture_hint"></span>
              </div>
              <svg id="route-map" viewBox="0 0 720 340" role="img" aria-labelledby="map-title map-description">
                <title id="map-title" data-i18n="map_title"></title>
                <desc id="map-description" data-i18n="map_description"></desc>
                <defs><clipPath id="map-viewport-clip"><rect id="map-viewport-rect"/></clipPath></defs>
                <g id="map-boundary" aria-hidden="true"></g>
                <g id="map-grid" aria-hidden="true"></g>
                <g id="map-axes" aria-hidden="true"></g>
                <g id="map-content"></g>
                <text id="longitude-label" class="axis-title" data-i18n="longitude_axis"></text>
                <text id="latitude-label" class="axis-title" data-i18n="latitude_axis"></text>
              </svg>
              <p id="map-credit" class="muted" hidden>© OpenStreetMap contributors · ODbL</p>
            </figure>
          <section class="point-card" data-i18n-aria="current_point_label">
            <p class="eyebrow" data-i18n="current_point_label"></p>
            <p id="point-count" class="point-count"></p>
            <p id="point-cell" class="point-cell"></p>
            <div class="point-sound"><strong id="point-note"></strong><p id="point-note-detail"></p></div>
            <div id="current-step" data-i18n-aria="current_step_label" role="group">
              <time id="step-date"></time><p id="step-place"></p><p id="step-position"></p>
            </div>
            <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
          </section>
        </div>
        <ol id="journey-progress" class="journey-progress" data-i18n-aria="journey" hidden></ol>
        <p id="journey-caveat" class="muted" data-i18n="journey_caveat" hidden></p>
        <section class="scale-strip" data-i18n-aria="legend_label">
          <p class="eyebrow" data-i18n="legend_label"></p><ul id="legend" data-i18n-aria="legend_label"></ul>
        </section>
        <details id="technical-details" class="technical-details">
          <summary data-i18n="technical_information"></summary>
          <p id="season-info" class="muted"></p>
      <section id="route-context-card" class="card" aria-labelledby="region-heading" hidden><p class="eyebrow" data-i18n="route_context"></p><h2 id="region-heading"></h2><p id="route-summary"></p><ol id="route-landmarks"></ol><p id="description" class="muted" hidden></p><p id="map-attribution" class="muted" hidden><a id="map-source" target="_blank" rel="noopener noreferrer" data-i18n="map_source"></a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors · ODbL</a></p></section>
              <p class="muted" data-i18n="route_hint"></p>
            <section id="live-inspector" class="card" hidden><h2 data-i18n="live_inspector"></h2><p id="live-pixel"></p></section>
            <details id="timing-details" open>
              <summary data-i18n="timing_summary"></summary>
              <div class="table-scroll">
                <table id="timeline">
                  <caption id="timeline-caption"></caption>
                  <thead><tr>
                    <th scope="col" data-i18n="col_index"></th>
                    <th scope="col" data-i18n="col_cell"></th>
                    <th id="date-column" scope="col" data-i18n="col_date" hidden></th>
                    <th scope="col" data-i18n="col_class"></th>
                    <th scope="col" data-i18n="col_note"></th>
                    <th scope="col" data-i18n="col_interval"></th>
                  </tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </details>
            <details id="live-diagnostics" hidden><summary data-i18n="live_diagnostics"></summary><p id="live-counts"></p><p id="live-cache-path"></p>
              <div class="transport"><button id="clear-live-cache" class="secondary" data-i18n="live_clear_cache"></button><button id="refresh-eic-dates" class="secondary" data-i18n="live_refresh_dates" hidden></button></div><p id="catalog-error" data-i18n="live_catalog_error" role="alert" hidden></p><p id="missing-frame-dates"></p><p id="live-point-errors"></p>
              <fieldset id="live-layers" hidden><legend data-i18n="live_layers"></legend><label><input type="checkbox" id="live-snow"><span data-i18n="live_snow"></span></label><label><input type="checkbox" id="live-temperature" checked><span data-i18n="live_temperature"></span></label></fieldset>
              <div class="table-scroll"><table id="live-requests"><thead><tr><th data-i18n="live_layer"></th><th data-i18n="live_date"></th><th data-i18n="live_actual"></th><th data-i18n="live_state"></th><th data-i18n="live_source"></th></tr></thead><tbody></tbody></table></div>
            </details>
              <details id="scale-details"><summary data-i18n="scale_summary"></summary><p id="scale-description"></p><p id="provider-method" hidden></p><a href="https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_NDVI.xml" target="_blank" rel="noopener noreferrer" data-i18n="legend_source"></a></details>
        </details>
      </section>
      <section id="method-view" class="view" role="tabpanel" aria-labelledby="tab-method" hidden>
        <div class="page-heading"><div><p class="eyebrow" data-i18n="method_eyebrow"></p><h1 data-i18n="method_title"></h1><p data-i18n="method_intro"></p></div></div>
        <ul id="method-scale" class="method-scale" data-i18n-aria="legend_label"></ul>
        <div class="method-steps"><article><span>01</span><h2 data-i18n="method_frame"></h2><p data-i18n="method_frame_detail"></p></article><article><span>02</span><h2 data-i18n="method_route"></h2><p data-i18n="method_route_detail"></p></article><article><span>03</span><h2 data-i18n="method_notes"></h2><p data-i18n="method_notes_detail"></p></article></div>
        <div class="method-grid"><section class="card"><h2 data-i18n="sources_heading"></h2><p id="observation-source"></p><p><a href="https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_NDVI.xml" target="_blank" rel="noopener noreferrer" data-i18n="legend_source"></a></p></section><section class="card"><h2 data-i18n="interpret_heading"></h2><p data-i18n="interpret_ndvi"></p><p data-i18n="interpret_dates"></p><p data-i18n="route_geometry_caveat"></p></section></div>
        <p class="muted" data-i18n="route_map_caveat"></p>
        <button class="secondary back-button" data-open-view="listen" data-i18n="back_listen"></button>
      </section>
    </div>
    </div>
    <footer><p id="footer" class="muted" data-i18n="footer"></p><span>DAIRN / STEPPE JUKEBOX · <span id="app-version"></span></span></footer>
  </div>
</main>
</body>
</html>
