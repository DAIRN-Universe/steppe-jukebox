<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steppe Jukebox</title>
  <link rel="stylesheet" href="styles.css">
  <script src="player.js" defer></script>
</head>
<body>
<main id="interface" data-i18n-aria="interface_label" hidden>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span><strong>DAIRN</strong><small>STEPPE JUKEBOX</small></span></div>
    <nav id="navigation" role="tablist" data-i18n-aria="navigation_label">
      <button id="tab-listen" role="tab" aria-selected="true" aria-controls="listen-view" data-view="listen" data-i18n="listen_nav"></button>
      <button id="tab-places" role="tab" aria-selected="false" aria-controls="places-view" tabindex="-1" data-view="places" data-i18n="places_nav"></button>
      <button id="tab-method" role="tab" aria-selected="false" aria-controls="method-view" tabindex="-1" data-view="method" data-i18n="method_nav"></button>
    </nav>
    <div class="language-field">
      <label for="language" data-i18n="language_label">Language</label>
      <select id="language">
        <option id="system-language" value="auto">System language</option>
        <option value="kk" lang="kk">Қазақша</option>
        <option value="en" lang="en">English</option>
        <option value="ru" lang="ru">Русский</option>
      </select>
    </div>
  </header>
  <div class="page-content">
    <div id="region-field" class="region-field" hidden>
      <label for="region" data-i18n="region_label"></label><select id="region"></select>
    </div>
    <p id="test-warning" class="warning" data-i18n="test_warning" hidden></p>
    <p id="data-error" role="alert" hidden></p>
    <div id="player" hidden>
      <section id="listen-view" class="view" role="tabpanel" aria-labelledby="tab-listen">
        <div class="page-heading"><div><p class="eyebrow" data-i18n="listen_eyebrow"></p><h1 data-i18n="listen_title"></h1><p data-i18n="intro"></p></div><span class="pill" data-i18n="experience_label"></span></div>
        <div class="listen-grid">
          <div class="main-column">
            <div class="selections">
              <div id="mode-field" class="season-field" hidden>
                <label for="mode" data-i18n="mode_label"></label>
                <select id="mode"><option value="fixed" data-i18n="fixed_mode"></option><option value="journey" data-i18n="journey"></option></select>
              </div>
              <div id="season-field" class="season-field">
                <label for="season" data-i18n="season_label">Season</label><select id="season" aria-describedby="season-info"></select>
              </div>
            </div>
            <figure class="map-card">
              <figcaption><span id="map-region"></span><span data-i18n="route_heading"></span></figcaption>
              <p class="muted" data-i18n="route_hint"></p>
              <svg id="route-map" viewBox="0 0 720 340" role="img" aria-labelledby="map-title map-description">
                <title id="map-title" data-i18n="map_title"></title>
                <desc id="map-description" data-i18n="map_description"></desc>
                <g id="map-boundary" aria-hidden="true"></g>
                <g id="map-grid" aria-hidden="true"></g>
                <g id="map-axes" aria-hidden="true"></g>
                <g id="map-content"></g>
                <text id="longitude-label" class="axis-title" data-i18n="longitude_axis"></text>
                <text id="latitude-label" class="axis-title" data-i18n="latitude_axis"></text>
              </svg>
              <p id="map-credit" class="muted" hidden>© OpenStreetMap contributors · ODbL</p>
            </figure>
            <section class="playback-card" data-i18n-aria="player_heading">
              <div class="transport"><button id="toggle" type="button" aria-controls="audio">Play</button><button id="restart" class="secondary" type="button" data-i18n="restart"></button><span id="tempo"></span></div>
              <p id="season-info" class="muted"></p>
              <p id="journey-caveat" class="muted" data-i18n="journey_caveat" hidden></p>
              <audio id="audio" preload="auto" data-i18n-aria="audio_label"></audio>
              <div class="position"><progress id="progress" value="0" max="1" data-i18n-aria="progress_label"></progress><span id="clock"></span></div>
              <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
              <div id="current-step" data-i18n-aria="current_step_label" role="group" hidden>
                <p><strong data-i18n="current_date_label"></strong> <time id="step-date"></time></p><p id="step-place"></p><p id="step-position" class="muted"></p>
              </div>
              <p id="keyboard-help" class="muted" data-i18n="keyboard_help"></p><p id="error" role="alert" hidden></p>
            </section>
            <details id="timing-details" open>
              <summary data-i18n="timing_summary"></summary>
              <div class="table-scroll">
                <table id="timeline">
                  <caption id="timeline-caption"></caption>
                  <thead><tr>
                    <th scope="col" data-i18n="col_index"></th>
                    <th scope="col" data-i18n="col_cell"></th>
                    <th id="date-column" scope="col" data-i18n="col_date" hidden></th>
                    <th scope="col" data-i18n="col_class"></th>
                    <th scope="col" data-i18n="col_note"></th>
                    <th scope="col" data-i18n="col_interval"></th>
                  </tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </details>
          </div>
          <aside class="context-column">
            <section class="card"><p class="eyebrow" data-i18n="scale_eyebrow"></p><h2 data-i18n="scale_heading"></h2><p data-i18n="scale_intro"></p>
              <ul id="legend" data-i18n-aria="legend_label"></ul><p class="scale-direction"><span data-i18n="less_green"></span><span data-i18n="more_green"></span></p>
              <details id="scale-details"><summary data-i18n="scale_summary"></summary><p id="scale-description"></p><a href="https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_NDVI.xml" target="_blank" rel="noopener noreferrer" data-i18n="legend_source"></a></details>
            </section>
            <section class="card"><p class="eyebrow" data-i18n="route_context"></p><h2 id="region-heading"></h2><p id="route-summary"></p><ol id="route-landmarks"></ol><p id="description" class="muted" hidden></p><p id="map-attribution" class="muted" hidden><a id="map-source" target="_blank" rel="noopener noreferrer" data-i18n="map_source"></a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors · ODbL</a></p></section>
            <section class="card field-context"><p class="eyebrow" data-i18n="field_context"></p><p id="field-summary"></p><button class="secondary" data-open-view="places" data-i18n="places_nav"></button></section>
          </aside>
        </div>
      </section>
      <section id="places-view" class="view" role="tabpanel" aria-labelledby="tab-places" hidden>
        <div class="page-heading"><div><p class="eyebrow" data-i18n="field_context"></p><h1 data-i18n="places_nav"></h1><p data-i18n="places_intro"></p></div></div>
        <p class="notice" data-i18n="botany_caveat"></p>
        <div id="place-tabs" class="place-tabs" role="group" data-i18n-aria="place_picker"></div>
        <article id="place-content" class="card"></article>
        <button class="secondary back-button" data-open-view="listen" data-i18n="back_listen"></button>
      </section>
      <section id="method-view" class="view" role="tabpanel" aria-labelledby="tab-method" hidden>
        <div class="page-heading"><div><p class="eyebrow" data-i18n="method_eyebrow"></p><h1 data-i18n="method_title"></h1><p data-i18n="method_intro"></p></div></div>
        <div class="method-steps"><article><span>01</span><h2 data-i18n="method_frame"></h2><p data-i18n="method_frame_detail"></p></article><article><span>02</span><h2 data-i18n="method_route"></h2><p data-i18n="method_route_detail"></p></article><article><span>03</span><h2 data-i18n="method_notes"></h2><p data-i18n="method_notes_detail"></p></article></div>
        <div class="method-grid"><section class="card"><h2 data-i18n="sources_heading"></h2><p id="observation-source"></p><p><a href="https://gibs.earthdata.nasa.gov/colormaps/v1.3/MODIS_NDVI.xml" target="_blank" rel="noopener noreferrer" data-i18n="legend_source"></a></p><div id="literature-sources"></div></section><section class="card"><h2 data-i18n="interpret_heading"></h2><p data-i18n="interpret_ndvi"></p><p data-i18n="interpret_dates"></p><p data-i18n="interpret_field"></p><p data-i18n="route_geometry_caveat"></p></section></div>
        <button class="secondary back-button" data-open-view="listen" data-i18n="back_listen"></button>
      </section>
    </div>
    <footer><p id="footer" class="muted" data-i18n="footer"></p><span>DAIRN / STEPPE JUKEBOX</span></footer>
  </div>
</main>
</body>
</html>
